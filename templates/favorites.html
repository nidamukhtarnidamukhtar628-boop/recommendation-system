{% extends 'base.html' %}

{% block title %}My Favorites - SmartRec{% endblock %}

{% block content %}
    <div class="section-heading">
        <h4 class="m-0">My Favorites</h4>
        <div class="line"></div>
    </div>

    {% if movies|length == 0 %}
        <p class="text-muted">Abhi tak koi movie favorite nahi ki.</p>
    {% endif %}

    <div class="row">
        {% for movie in movies %}
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card h-100">
                <img src="{{ movie.poster }}" class="card-img-top" alt="{{ movie.title }}">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <h6 class="card-title m-0">{{ movie.title }}</h6>
                    <form method="POST" action="/favorite/{{ movie.id }}" class="m-0 fav-form" data-movie-id="{{ movie.id }}">
                        <input type="hidden" name="movie_title" value="{{ movie.title }}">
                        <button type="submit" class="fav-btn">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
