{% extends 'base.html' %}

{% block title %}Register - SmartRec{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>Create Account</h2>
        <p class="auth-subtitle">Join SmartRec and discover movies you'll love</p>

        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group-custom">
                <i class="fa-solid fa-user"></i>
                <input type="text" class="form-control" name="username" placeholder="Username" required>
            </div>
            <div class="input-group-custom">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" class="form-control" name="email" placeholder="Email address" required>
            </div>
            <div class="input-group-custom">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-gradient w-100">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>
{% endblock %}
